name: CI

on:
  pull_request:
  push:
    paths-ignore:
    - '**.md'
    - '**.jpg'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs_version:
          - "25.1"
          - "30.2"
          - "31.1"
          - "snapshot"
    steps:
      - uses: actions/checkout@v6
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: Run tests
        run: make test
